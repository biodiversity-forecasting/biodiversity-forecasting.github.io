# Publikasjonar frå Nasjonalt vitenarkiv (NVA).
# Skriv inn ID-en til CBF-prosjektet i NVA (talet i adressa nva.sikt.no/projects/<ID>).
# Prosjektet kan registrerast i NVA før NFR-prosjektnummeret er klart. Så lenge lista er tom, er publikasjonssida skjult.
nva:
  projects: []      # t.d. [2769822]

# LinkedIn. Skriv inn adressa til LinkedIn-sida til senteret.
# Under posts legg de inn innlegg de vil visa: opna innlegget på LinkedIn, vel «…» → «Bygg inn dette innlegget»,
# og kopier koden som ser ut som urn:li:share:7262... (eller urn:li:activity:...).
# Innlegga vert fyrst lasta når den besøkjande klikkar (personvern: LinkedIn set informasjonskapslar).
linkedin:
  url: "https://www.linkedin.com/company/centre-for-biodiversity-forecasting/"
  posts: []
